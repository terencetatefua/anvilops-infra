<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnvilOps — AI Chat Demo</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a1f2e;
      --border: #2a3142;
      --text: #e6edf3;
      --muted: #8b949e;
      --user-bubble: #1f6feb;
      --ai-bubble: #21262d;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    header p {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--ai-bubble);
      border: 1px solid var(--border);
    }
    .message.thinking {
      color: var(--muted);
      font-style: italic;
    }
    .message.error {
      align-self: flex-start;
      background: #5a1d1d;
      border: 1px solid #8b2c2c;
      color: #f0b4b4;
    }

    #composer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 0.75rem;
    }

    #input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 160px;
    }
    #input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 0 1.25rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { background: #79b8ff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>AnvilOps — AI Chat Demo</h1>
    <p>Running on Kubernetes + GitOps. Backend: <span id="backend-label">Ollama (local)</span></p>
  </header>

  <div id="messages"></div>

  <form id="composer">
    <textarea id="input" placeholder="Ask anything..." rows="1" autofocus></textarea>
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl    = document.getElementById("input");
    const sendBtn    = document.getElementById("send-btn");
    const composer   = document.getElementById("composer");

    const history = [];

    function addMessage(role, content, extraClass = "") {
      const div = document.createElement("div");
      div.className = `message ${role} ${extraClass}`.trim();
      div.textContent = content;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage(prompt) {
      addMessage("user", prompt);
      const thinkingEl = addMessage("assistant", "thinking...", "thinking");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, history }),
        });

        const data = await response.json();
        thinkingEl.remove();

        if (!response.ok) {
          addMessage("assistant", data.error || "Something went wrong.", "error");
          return;
        }

        addMessage("assistant", data.response);
        history.push({ role: "user",      content: prompt });
        history.push({ role: "assistant", content: data.response });
      } catch (err) {
        thinkingEl.remove();
        addMessage("assistant", `Network error: ${err.message}`, "error");
      }
    }

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      const prompt = inputEl.value.trim();
      if (!prompt) return;
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;
      sendMessage(prompt).finally(() => {
        sendBtn.disabled = false;
        inputEl.focus();
      });
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        composer.requestSubmit();
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });
  </script>
</body>
</html>
