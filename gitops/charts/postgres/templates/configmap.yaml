apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-init
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  init.sql: |
    -- Enable pgvector extension on first database init.
    CREATE EXTENSION IF NOT EXISTS vector;
